<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>《互动编程》作业一 · 创意代码的基本原理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f2ece1; color: #1a1a1a;
      font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 56px 24px 80px;
    }
    header { text-align: center; max-width: 760px; margin-bottom: 48px; }
    .tag {
      display: inline-block; font-size: 13px; letter-spacing: 2px;
      padding: 4px 12px; border: 1.5px solid #1a1a1a; border-radius: 999px; margin-bottom: 18px;
    }
    h1 { font-size: 34px; line-height: 1.3; margin-bottom: 12px; }
    h1 .accent { color: #e63946; }
    header p { font-size: 15px; opacity: .7; line-height: 1.7; }
    .grid {
      display: grid; grid-template-columns: repeat(2, minmax(260px, 340px));
      gap: 28px; width: 100%; max-width: 720px;
    }
    .card {
      background: #fff; border: 2px solid #1a1a1a; border-radius: 16px;
      padding: 28px 24px; text-decoration: none; color: inherit;
      transition: transform .18s ease, box-shadow .18s ease;
      display: flex; flex-direction: column; gap: 14px;
    }
    .card:hover { transform: translateY(-6px); box-shadow: 8px 8px 0 #1a1a1a; }
    .card .num {
      width: 42px; height: 42px; border-radius: 50%; color: #fff;
      display: grid; place-items: center; font-weight: 700; font-size: 18px;
    }
    .card.s .num { background: #e63946; }
    .card.k .num { background: #2a9d8f; }
    .card h2 { font-size: 20px; }
    .card p { font-size: 13.5px; opacity: .72; line-height: 1.6; }
    .card .go { margin-top: auto; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
    footer { margin-top: 56px; font-size: 12.5px; opacity: .5; text-align: center; }
    @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <span class="tag">IP · 01 · P5.JS</span>
    <h1>创意代码的<span class="accent">基本原理</span></h1>
    <p>数字媒体艺术专业 · 2026 秋季学期 · 作业一（权重 20%）<br />
       两份 p5.js 作品：几何构成（静态）+ 几何构成（动态）。点击进入查看。</p>
  </header>

  <main class="grid">
    <a class="card s" href="static.html">
      <span class="num">1</span>
      <h2>几何构成（静态）</h2>
      <p>仅用形状、颜色、位置构图，setup() 中 noLoop() 一次性绘制，无动画循环。</p>
      <span class="go">→ 打开 static.html</span>
    </a>
    <a class="card k" href="kinetic.html">
      <span class="num">2</span>
      <h2>几何构成（动态）</h2>
      <p>同一套几何语言，加入 draw() 循环与正弦律动，画面随帧轻微"呼吸"。</p>
      <span class="go">→ 打开 kinetic.html</span>
    </a>
  </main>

  <footer>仓库：ip-01-p5-works · 已开启 GitHub Pages · 录屏见提交附件</footer>
</body>
</html>
